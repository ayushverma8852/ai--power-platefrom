# ===================================================================
# InterviewPrep AI - Spring Boot Application Configuration
# ===================================================================

server.port=8080
spring.application.name=interviewprep-backend

# Primary Database Configuration (MySQL with env override)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/interviewprep_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson JSON
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Python FastAPI AI Service Integration
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.connect-timeout-ms=5000
ai.service.read-timeout-ms=45000

# Logging
logging.level.com.interviewprep=INFO
logging.level.org.springframework.web=INFO
