# =============================================================================
# Standalone Development Profile (In-Memory H2, no MySQL setup required)
# Activate with: --spring.profiles.active=dev
# =============================================================================
spring.application.name=InterviewPrep AI Backend (Dev)
server.port=8080

spring.datasource.url=jdbc:h2:mem:interviewprep_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

# AI Microservice integration
app.ai-service.url=http://localhost:8000
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
