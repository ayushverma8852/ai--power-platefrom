# =============================================================================
# InterviewPrep AI - Spring Boot Production Configuration
# Profile: prod
# =============================================================================
spring.application.name=InterviewPrep AI Backend (Prod)
server.port=${PORT:8080}

# -----------------------------------------------------------------------------
# Database Configuration (MySQL 8+ Production)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:interviewprep_ai}?createDatabaseIfNotExist=false&useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate (Flyway is single source of truth)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# -----------------------------------------------------------------------------
# Security & JWT (Strictly Externalized)
# -----------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# -----------------------------------------------------------------------------
# AI Microservice URL
# -----------------------------------------------------------------------------
app.ai-service.url=${AI_SERVICE_URL}
app.ai-service.connect-timeout-ms=5000
app.ai-service.read-timeout-ms=45000

# -----------------------------------------------------------------------------
# Production Logging
# -----------------------------------------------------------------------------
logging.level.root=WARN
logging.level.com.interviewprep=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
