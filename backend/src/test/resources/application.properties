spring.application.name=InterviewPrep AI Backend (Test)
app.jwt.secret=test-secret-key-at-least-32-characters-long-for-testing-only-12345
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.ai-service.url=http://localhost:8000

# In-memory H2 database for testing
spring.datasource.url=jdbc:h2:mem:interviewprep_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
